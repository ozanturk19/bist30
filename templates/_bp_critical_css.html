{#- CPO 19.09: TEK KAYNAK — anti-CLS "sayfa başlığını gizle + nav layout'u kilitle" kuralları
    + üst navigasyon (.bp-nav-item) stili. Önceden bu blok ~19 şablona AYNI metin olarak
    kopyalanmıştı (bp-critical-css id'li <style> içinde), aralarında zaten küçük bir fark
    oluşmuştu (bazı sayfalar div.page-title varyantını, bazıları taşımıyordu) — bu, Ozan'ın
    "sayfalar birbiriyle konuşmuyor" bulgusunun somut bir örneğiydi (bkz. memory
    project_data_art_kapsamli_donusum_baslangici_18_09). Artık HER include eden sayfa bu TEK
    dosyayı miras alıyor; <style> etiketi kendisi her sayfada kalıyor (inline, anti-CLS için
    ilk boyamadan önce hazır olmalı — bir <link> harici dosyaya çevirmek FOUC/CLS riski
    yaratırdı, bu yüzden Jinja include ile "sunucu tarafında birleştirilmiş tek kaynak" yolu
    seçildi, ekstra HTTP isteği yok).

    Ayrıca burada gerçek bir bulgu düzeltildi: `.bp-nav-item[aria-current="page"]` (aktif
    sayfa vurgusu) SADECE index.html'in kendi <style> bloğunda tanımlıydı — _header.html'in
    kendi script'i (satır ~119) `aria-current` attribute'unu HER sayfada doğru set ediyordu
    ama bunu görünür kılan CSS kuralı diğer ~18 sayfanın HİÇBİRİNDE yoktu, yani kullanıcı
    ana sayfa dışında hangi sayfada olduğunu üst menüden hiç göremiyordu. Şimdi tüm sayfalarda
    var + Data-Art diliyle (pill şekli, hafif döndürme) yeniden tasarlandı. -#}
/* anti-CLS: hide page titles + lock nav layout */header h1.page-title,header div.page-title,header h1.header-name,header .page-sub,header .header-sub{display:none !important}header > .header-info,header > div:has(> h1.page-title),header > div:has(> div.page-title),header > div:has(> h1.header-name),header > div:has(> .page-sub),header > div:has(> .header-sub){display:none !important}header div[style]:has(> h1.page-title),header div[style]:has(> div.page-title),header div[style]:has(> h1.header-name){display:none !important}.bp-main-nav{display:flex;align-items:center;justify-content:safe center;gap:6px;flex:1;min-width:0;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}.bp-main-nav::-webkit-scrollbar{display:none}.bp-nav-item{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:var(--bp-radius-pill);font-size:var(--bp-text-xs);line-height:1;flex-shrink:0;white-space:nowrap;text-transform:uppercase;letter-spacing:0.6px;color:var(--bp-text2);text-decoration:none;background:none;border:1px solid transparent;cursor:pointer;font-family:"Space Grotesk",system-ui,sans-serif;transition:color .15s ease,background .15s ease,border-color .15s ease,transform .15s ease}.bp-nav-item:hover{color:var(--bp-text);background:var(--bp-surface2);transform:translateY(-1px)}.bp-nav-item[aria-current="page"]{color:var(--bp-brand);background:rgba(var(--bp-brand-rgb),.12);border-color:rgba(var(--bp-brand-rgb),.28);transform:rotate(-1deg)}.bp-nav-item[aria-current="page"]:hover{transform:rotate(-1deg) translateY(-1px)}.bp-nav-more-wrap{position:relative;flex-shrink:0}.bp-nav-more-menu{display:none}.search-overlay,.bp-search-overlay{display:none}.header-search-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex-shrink:0;background:transparent;border:1px solid var(--bp-border);border-radius:var(--bp-radius);color:var(--bp-text2);cursor:pointer}@media (max-width:900px){.bp-main-nav{display:none}}.skip-link{position:absolute;top:-40px;left:0;background:var(--bp-brand);color:var(--bp-bg);padding:8px 16px;z-index:var(--bp-z-toast);text-decoration:none;font-size:var(--bp-text-md);font-weight:600;border-radius:0 0 4px 0}.skip-link:focus{top:0}:focus-visible{outline:2px solid var(--bp-brand);outline-offset:2px}/* K-O (21.09): .bp-main-nav overflow-x:auto -> overflow-y de auto olur ve client kutusu nav ogesiyle AYNI yukseklikte (27px). Disariya cizilen 2px+2px halkanin ust/alt kenarlari TAMAMEN kirpiliyordu (canli boyama testiyle dogrulandi). Halka ice alindi: layout etkisi sifir, WCAG 2.4.7. */.bp-main-nav :focus-visible{outline-offset:-2px}:focus:not(:focus-visible){outline:none}
