<!DOCTYPE html>
<html lang="tr">
<head>
{% include '_head.html' %}
<title>Sayfa Bulunamadı | BorsaPusula</title>
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=optional" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=optional"></noscript>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/css/tokens.css?v=20260808F">
<style>
  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body {
    margin: 0; padding: 0; background: var(--bp-bg);
    color: var(--bp-text);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  header {
    background: var(--bp-bg);
    border-bottom: 1px solid var(--bp-border);
    padding: 10px 20px;
    display: flex; align-items: center; gap: 10px;
    min-height: 60px; max-height: 60px;
  }
  header a.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--bp-text); }
  header .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; }
  header .brand-name b { color: var(--bp-brand); }
  main {
    max-width: 640px;
    margin: 64px auto;
    padding: 0 20px;
    text-align: center;
  }
  .code {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px; font-weight: 700;
    color: var(--bp-text3);
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px; font-weight: 800;
    margin: 0 0 10px;
    letter-spacing: -0.5px;
  }
  p.lead { color: var(--bp-text3); font-size: 14px; margin: 0 0 28px; }
  .search-card {
    background: var(--bp-surface);
    border: 1px solid var(--bp-border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 24px;
    text-align: left;
  }
  .search-card label { display: block; font-size: 12px; color: var(--bp-text3); margin-bottom: 8px; }
  .search-row { display: flex; gap: 8px; }
  .search-row input {
    flex: 1;
    background: var(--bp-surface2);
    border: 1.5px solid var(--bp-border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--bp-text);
    font-size: 14px;
    font-family: inherit;
    text-transform: uppercase;
  }
  .search-row input:focus { outline: none; border-color: var(--bp-brand); }
  .search-row button {
    background: var(--bp-brand);
    color: #fff; border: none; border-radius: 8px;
    padding: 0 18px; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .popular { text-align: left; }
  .popular h2 { font-size: 13px; color: var(--bp-text3); font-weight: 700; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .popular-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }
  .popular-grid a {
    display: block;
    background: var(--bp-surface);
    border: 1px solid var(--bp-border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--bp-text2);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: border-color .15s;
  }
  .popular-grid a:hover { border-color: var(--bp-brand); color: var(--bp-text); }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">
    <img src="/static/favicon.svg" alt="" width="26" height="26">
    <span class="brand-name">Borsa<b>Pusula</b></span>
  </a>
</header>
<main>
  <div class="code">404</div>
  <h1>Bu sayfa bulunamadı</h1>
  <p class="lead">Aradığınız sayfa taşınmış veya kaldırılmış olabilir. Bir hisse arayın ya da popüler sayfalara göz atın.</p>

  <div class="search-card">
    <label for="q404">Hisse kodu ile ara (ör. THYAO)</label>
    <form class="search-row" onsubmit="event.preventDefault(); var v=document.getElementById('q404').value.trim().toUpperCase(); if(v) window.location.href='/hisse/'+encodeURIComponent(v);">
      <input id="q404" type="text" maxlength="10" placeholder="THYAO, GARAN, ASELS...">
      <button type="submit">Git</button>
    </form>
  </div>

  <div class="popular">
    <h2>Popüler Sayfalar</h2>
    <div class="popular-grid">
      <a href="/">Ana Sayfa</a>
      <a href="/tarama">Tarama</a>
      <a href="/bilanco-takvimi">Bilanço Takvimi</a>
      <a href="/sektor-harita">Sektörler</a>
      <a href="/sinyal-performans">Performans</a>
      <a href="/blog">Blog</a>
    </div>
  </div>
</main>
</body>
</html>
